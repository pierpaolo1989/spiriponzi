<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Join Spiriponzi</title>
  <desc id="description">Learn about Bitcoin, play games, and earn coins with Spiriponzi</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172b4d"/>
      <stop offset="1" stop-color="#536fca"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4a0"/>
      <stop offset="1" stop-color="#f2be55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="24" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="300" fill="#ffffff" opacity=".04"/>
  <circle cx="875" cy="315" r="170" fill="url(#coin)" stroke="#fff1c8" stroke-width="10"/>
  <circle cx="875" cy="315" r="143" fill="none" stroke="#203866" stroke-width="5" opacity=".45"/>
  <text x="875" y="380" fill="#172b4d" font-family="Arial,sans-serif" font-size="178" font-weight="700" text-anchor="middle">S</text>
  <text x="90" y="190" fill="#ffffff" font-family="Arial,sans-serif" font-size="64" font-weight="700">SPIRIPONZI</text>
  <text x="90" y="280" fill="#ffe4a0" font-family="Arial,sans-serif" font-size="38" font-weight="700">LEARN. PLAY. EARN.</text>
  <text x="90" y="360" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="30">Explore Bitcoin, play games,</text>
  <text x="90" y="407" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="30">and earn coins along the way.</text>
  <rect x="90" y="475" width="290" height="76" rx="38" fill="#f2be55"/>
  <text x="235" y="524" fill="#172b4d" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">JOIN SPIRIPONZI</text>
</svg>
