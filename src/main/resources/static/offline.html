<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#182a52">
	<title>Spiriponzi - Offline</title>
	<link rel="icon" type="image/png" sizes="192x192" href="/img/icons/icon-192.png">
	<style>
		* { box-sizing: border-box; }
		body {
			align-items: center;
			background: linear-gradient(180deg, #4e73df 10%, #224abe 100%);
			color: #fff;
			display: flex;
			font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			justify-content: center;
			margin: 0;
			min-height: 100vh;
			min-height: 100dvh;
			padding: calc(1.5rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right))
				calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
			text-align: center;
			-webkit-text-size-adjust: 100%;
		}
		main { max-width: 26rem; }
		img { height: 96px; width: 96px; }
		h1 { font-size: 1.6rem; margin: 1rem 0 0.5rem; }
		p { color: #e5ebff; line-height: 1.6; margin: 0 0 1.5rem; }
		button {
			background: #fff;
			border: 0;
			border-radius: 0.5rem;
			color: #224abe;
			cursor: pointer;
			font: inherit;
			font-weight: 800;
			min-height: 48px;
			padding: 0.75rem 1.5rem;
			touch-action: manipulation;
		}
	</style>
</head>
<body>
<main>
	<img src="/img/spiriponzi-mark.svg" alt="">
	<h1>You're offline</h1>
	<p>Spiriponzi needs a connection to load this page. Check your network and try again.</p>
	<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
