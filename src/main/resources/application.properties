spring.application.name=spiriponzi
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.resources.static-locations=file:src/main/resources/static/
spring.resources.cache.period=0
#default is 10
spring.datasource.hikari.maximum-pool-size=15
#default is same as max pool size
spring.datasource.hikari.minimum-idle=10
#default is 30 seconds
spring.datasource.hikari.connection-timeout=30000
#default is 600000 i.e 10 minutes
spring.datasource.hikari.idle-timeout=600000
#default is 1800000 i.e 30 minutes
spring.datasource.hikari.max-lifetime=1800000 
spring.datasource.hikari.pool-name=HikariConnPool

server.port=${SERVER_PORT:8080}

# Details for our datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spiriponzi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate properties
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true

# catpcha
google.recaptcha.key.site=${GOOGLE_CATPCHA_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
google.recaptcha.key.secret=${GOOGLE_CATPCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}

# bitcoin
bitcoin.network=org.bitcoin.test

# email
spring.mail.username=${EMAIL_USERNAME:spiriponzi.io@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:Aiap1957?^@#}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
