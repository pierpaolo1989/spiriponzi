spring.application.name=spiriponzi
spring.resources.cache.period=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariConnPool

server.port=${PORT:8080}

# TheoremReach surveys
theoremreach.api-key=${THEOREMREACH_API_KEY:}
theoremreach.secret-key=${THEOREMREACH_SECRET_KEY:}
# Configure this Reward Callback URL in the TheoremReach publisher dashboard.
# Keep THEOREMREACH_CALLBACK_URL below as the base URL without query parameters; it is used for signature verification.
# https://www.spiriponzi.cloud/callbacks/theoremreach?user_id={user_id}&reward={reward}&currency={currency}&tx_id={tx_id}&debug={debug}&reversal={reversal}
theoremreach.callback-url=${THEOREMREACH_CALLBACK_URL:https://www.spiriponzi.cloud/callbacks/theoremreach}

# Offerwall.GG
offerwall.public-key=${OFFERWALL_PUBLIC_KEY:}
offerwall.secret-key=${OFFERWALL_SECRET_KEY:}
offerwall.require-signature=${OFFERWALL_REQUIRE_SIGNATURE:false}

# CPX Research
cpx.app-security-hash=${CPX_APP_SECURITY_HASH:}

# Admin credentials are supplied through the environment (or the ignored local .env file).
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.mfa.email=${ADMIN_MFA_EMAIL:pierpaolo.pdd@gmail.com}
render.api-key=${RENDER_API_KEY:}
cloudflare.web-analytics.token=${CLOUDFLARE_WEB_ANALYTICS_TOKEN:}
cloudflare.analytics.api-token=${CLOUDFLARE_ANALYTICS_API_TOKEN:}
cloudflare.analytics.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.admin.password=${ADMIN_PASSWORD:Pippi1989?^@#}

# Details for our datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spiriponzi}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate properties
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:ads.sql,classpath:remove-civitelladelago-ads.sql
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true

# catpcha
google.recaptcha.key.site=${GOOGLE_CATPCHA_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
google.recaptcha.key.secret=${GOOGLE_CATPCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
withdrawals.allow-test-captcha=${WITHDRAWALS_ALLOW_TEST_CAPTCHA:false}

# bitcoin
bitcoin.network=${BITCOIN_NETWORK:org.bitcoin.test}

# email
spring.mail.username=${EMAIL_USERNAME:info@spiriponzi.cloud}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.host=${EMAIL_HOST:smtp.hostinger.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${EMAIL_FROM:info@spiriponzi.cloud}
app.support.email=${SUPPORT_EMAIL:info@spiriponzi.cloud}
app.public-base-url=${APP_PUBLIC_BASE_URL:https://www.spiriponzi.cloud}
app.google.enabled=${GOOGLE_LOGIN_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}


# Tymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
#spring.thymeleaf.prefix=file:src/main/resources/templates/
#spring.resources.static-locations=file:src/main/resources/static/
spring.resources.static-locations=classpath:/static/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
