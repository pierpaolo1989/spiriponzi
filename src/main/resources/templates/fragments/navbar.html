	<!-- Sidebar Toggle (Topbar) -->

		class="btn btn-link d-md-none rounded-circle mr-3">
		<i class="fa fa-bars"></i>
	</button>

	<!-- Topbar Search -->
	<form
		class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search"
		th:action="@{/search}" method="get">
		<div class="input-group">
			<input type="text" class="form-control bg-light border-0 small"
				name="q" placeholder="Search pages or ads..." aria-label="Search pages or ads"
				aria-describedby="basic-addon2" th:value="${query}">
			<div class="input-group-append">
				<button class="btn btn-primary" type="submit" aria-label="Search">
					<i class="fas fa-search fa-sm"></i>
				</button>
			</div>
		</div>
	</form>

	<!-- Topbar Navbar -->
	<ul class="navbar-nav ml-auto">

		<li class="nav-item d-flex align-items-center">
			<button id="themeToggle" class="btn btn-link nav-link px-2" type="button"
				aria-label="Activate dark mode" aria-pressed="false" title="Dark mode">
				<i id="themeToggleIcon" class="fas fa-moon" aria-hidden="true"></i>
				<span class="sr-only">Toggle dark mode</span>
			</button>
		</li>

		<!-- Nav Item - Search Dropdown (Visible Only XS) -->
		<li class="nav-item dropdown no-arrow d-sm-none"><a
			class="nav-link dropdown-toggle" href="#" id="searchDropdown"
			role="button" data-toggle="dropdown" aria-haspopup="true"
			aria-expanded="false"> <i class="fas fa-search fa-fw"></i>
		</a> <!-- Dropdown - Messages -->
			<div
				class="dropdown-menu dropdown-menu-right p-3 shadow animated--grow-in"
				aria-labelledby="searchDropdown">
				<form class="form-inline mr-auto w-100 navbar-search"
					th:action="@{/search}" method="get">
					<div class="input-group">
						<input type="text" class="form-control bg-light border-0 small"
							name="q" placeholder="Search pages or ads..." aria-label="Search pages or ads"
							aria-describedby="basic-addon2" th:value="${query}">
						<div class="input-group-append">
							<button class="btn btn-primary" type="submit" aria-label="Search">
								<i class="fas fa-search fa-sm"></i>
							</button>
						</div>
					</div>
				</form>
			</div></li>

		<div class="topbar-divider d-none d-sm-block"></div>

		<!-- Nav Item - User Information -->
		<li class="nav-item dropdown no-arrow"><a
			class="nav-link dropdown-toggle" href="#" id="userDropdown"
			role="button" data-toggle="dropdown" aria-haspopup="true"
			aria-expanded="false"> <span
				class="mr-2 d-none d-lg-inline text-gray-600 small"> <span
					sec:authentication="username"></span>
			</span>
			<img th:if="${googleProfilePicture != null}" class="img-profile rounded-circle"
				th:src="${googleProfilePicture}" alt="Google profile picture" referrerpolicy="no-referrer">
			<img th:unless="${googleProfilePicture != null}" class="img-profile rounded-circle"
				src="img/undraw_profile.svg" alt="">
		</a> <!-- Dropdown - User Information -->
			<div
				class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
				aria-labelledby="userDropdown">
				<a class="dropdown-item" th:href="@{/profile}">
					<i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>Profile
				</a>
				<a class="dropdown-item" th:href="@{/support}">
					<i class="fas fa-life-ring fa-sm fa-fw mr-2 text-gray-400"></i>Contact support
				</a>
				<div class="dropdown-divider"></div>
				<a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">

				</a>
			</div></li>

	</ul>

</nav>
<script>
	(() => {
		const root = document.documentElement;
		const button = document.getElementById('themeToggle');
		const icon = document.getElementById('themeToggleIcon');
		const preferenceKey = 'spiriponzi.theme';

		function applyTheme(theme) {
			const dark = theme === 'dark';
			root.dataset.theme = dark ? 'dark' : 'light';
			button.setAttribute('aria-pressed', String(dark));
			button.setAttribute('aria-label', dark ? 'Activate light mode' : 'Activate dark mode');
			button.title = dark ? 'Light mode' : 'Dark mode';
			icon.className = dark ? 'fas fa-sun' : 'fas fa-moon';
		}

		let theme = 'light';
		try {
			theme = localStorage.getItem(preferenceKey) === 'dark' ? 'dark' : 'light';
		} catch (error) {
			console.error('Could not read the saved theme preference:', error);
		}
		applyTheme(theme);

		button.addEventListener('click', () => {
			theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
			applyTheme(theme);
			try {
				localStorage.setItem(preferenceKey, theme);
			} catch (error) {
				console.error('Could not save the theme preference:', error);
			}
		});
	})();
</script>
