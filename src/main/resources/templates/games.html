<!DOCTYPE html>

<head>

<link rel="icon" type="image/svg" href="img/favicon.ico">

<link th:href="@{vendor/fontawesome-free/css/all.min.css}"

<!-- Custom fonts for this template-->
<link
	href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet" />

<style>
iframe {
	width: -webkit-fill-available !important;

}

<body id="page-top">

	<div id="wrapper">

					<!-- Content Row -->
					<div th:replace="fragments/summary"></div>

					<hr class="divider">
					<br>

					<!-- Content Row -->

					<div class="row">

						<div class="col-lg-6 mb-4">

								<div class="card-body" style="min-height: 600px;">
									<div>
										<script

									</div>
								</div>
							</div>
						</div>

						<div class="col-lg-6 mb-4">

								<div class="card-body" style="min-height: 600px;">
									<div>
										<script
											src="https://cdn.htmlgames.com/embed.js?game=SoldierAttack3&amp;bgcolor=white"></script>
									</div>
								</div>
							</div>
						</div>

						<div class="col-lg-6 mb-4">

								<div
									class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Neon Math</h6>

								<!-- Card Body -->
								<div class="card-body" style="min-height: 600px;">

										<script
											src="https://cdn.htmlgames.com/embed.js?game=NeonMath&amp;bgcolor=white"></script>
									</div>

							</div>
						</div>

						<div class="col-lg-6 mb-4">
							<div class="card shadow mb-4">
								<div
									class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Galaxy

								</div>
								<!-- Card Body -->
								<div class="card-body" style="min-height: 600px;">
									<div>
										<script
											src="https://cdn.htmlgames.com/embed.js?game=GalaxyShooter&amp;bgcolor=white"></script>

	<script src='https://www.google.com/recaptcha/api.js'></script>
