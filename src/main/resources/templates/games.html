<style>
.game-embed iframe {
	width: 100% !important;
	height: 600px !important;
	min-height: 600px !important;
}

	.expand-icon {
    cursor: pointer;
    color: #007bff;
    font-size: 1.2rem;
    transition: transform 0.3s ease;
}
.expand-icon:hover {
    transform: scale(1.2);
}
.fullscreen-card {
    position: fixed !important;
    top: 0;
    left: 0;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 1040;
    background: white;
    overflow: auto;
    padding: 20px;
}
.fullscreen-card .card-body {
    height: calc(100vh - 100px) !important;
}
</style>
</head>

<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- Sidebar -->
		<div th:replace="~{fragments/sidebar}"></div>
		<!-- End of Sidebar -->

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- Topbar -->
				<div th:replace="~{fragments/navbar}"></div>
				<!-- End of Topbar -->

				<!-- Begin Page Content -->
				<div class="container-fluid">

					<!-- Page Heading -->
					<div
						class="d-sm-flex align-items-center justify-content-between mb-4">
						<h1 class="h3 mb-0 text-gray-800">Play games</h1>
						<i class="fas fa-money fa-sm text-white-50"></i>
					</div>

					<!-- Content Row -->
					<div th:replace="~{fragments/summary}"></div>

					<hr class="divider">
					<br>
					<!-- Content Row -->
					<div class="d-flex justify-content-center mb-3">
						<span class="text-muted text-center">
							<strong>Play to earn: every hour you can claim 50 coins</strong>
						</span>
					</div>
					<div class="text-center text-primary mb-3" role="status" aria-live="polite">
						<span id="gameClaimCountdown">Preparing your next game claim...</span>
					</div>
					<br>

					<div class="row">

						<div class="col-lg-6 mb-4">
							<div class="card shadow mb-4">
								<div
									class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Bubble BUbble</h6>
									<i class="fas fa-expand expand-icon" onclick="toggleFullscreen(this)" title="Espandi"></i>
								</div>
								<div class="card-body" style="min-height: 600px;">

									<div class="game-embed">
										<iframe title="Bubble Bubble"
											src="https://cdn.htmlgames.com/BubbleBubble/index.html?bgcolor=white"
											width="800" height="600" loading="lazy" allowfullscreen></iframe>
									</div>
								</div>
							</div>
						</div>

						<div class="col-lg-6 mb-4">
							<div class="card shadow mb-4">
								<div
									class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Soldier
										Attack 3</h6>
									<i class="fas fa-expand expand-icon" onclick="toggleFullscreen(this)" title="Espandi"></i>
								</div>
								<!-- Card Body -->
								<div class="card-body" style="min-height: 600px;">
									<div class="game-embed">
										<iframe title="Soldier Attack 3"
											src="https://cdn.htmlgames.com/SoldierAttack3/index.html?bgcolor=white"
											width="800" height="600" loading="lazy" allowfullscreen></iframe>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
						<iframe title="Advertisement" data-aa="2462874" loading="lazy"
							src="https://acceptable.a-ads.com/2462874/?size=Adaptive"
							style="border: 0; padding: 0; width: 70%; height: auto; overflow: hidden; display: block; margin: auto"></iframe>
					</div>

					<div class="row">
						<div class="col-lg-6 mb-4">
							<div class="card shadow mb-4">
								<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Neon Math</h6>
									<i class="fas fa-expand expand-icon" onclick="toggleFullscreen(this)" title="Espandi"></i>
								</div>
								<!-- Card Body -->
								<div class="card-body" style="min-height: 600px;">
									<div class="game-embed">
										<iframe title="Neon Math"
											src="https://cdn.htmlgames.com/NeonMath/index.html?bgcolor=white"
											width="800" height="600" loading="lazy" allowfullscreen></iframe>
									</div>
								</div>
							</div>
						</div>

						<div class="col-lg-6 mb-4">
							<div class="card shadow mb-4">
								<div
									class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
									<h6 class="m-0 font-weight-bold text-primary">Galaxy
										Shooter</h6>
									<i class="fas fa-expand expand-icon" onclick="toggleFullscreen(this)" title="Espandi"></i>
								</div>
								<!-- Card Body -->
								<div class="card-body" style="min-height: 600px;">
									<div class="game-embed">
										<iframe title="Galaxy Shooter"
											src="https://cdn.htmlgames.com/GalaxyShooter/index.html?bgcolor=white"
											width="800" height="600" loading="lazy" allowfullscreen></iframe>
									</div>
								</div>
							</div>
						</div>
					</div>

				</div>
				<!-- /.container-fluid -->

			</div>
			<!-- End of Main Content -->

			<!-- Footer -->
			<div th:replace="~{fragments/footer}"></div>
			<!-- End of Footer -->

		</div>
		<!-- End of Content Wrapper -->

	</div>
	<!-- End of Page Wrapper -->

	<!-- Scroll to Top Button-->
	<a class="scroll-to-top rounded" href="#page-top"> <i
		class="fas fa-angle-up"></i>
	</a>

	<div class="modal fade" id="gameClaimModal" tabindex="-1" role="dialog"
		 aria-labelledby="gameClaimModalLabel" aria-hidden="true"
		 data-backdrop="false" data-keyboard="true">
		<div class="modal-dialog modal-dialog-centered" role="document">
			<div class="modal-content">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title" id="gameClaimModalLabel">Game reward available</h5>
					<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
						<span aria-hidden="true">&times;</span>
					</button>
				</div>
				<div class="modal-body text-center">
					<p>Your game reward is ready. Claim 50 coins.</p>
					<div class="my-4" style="width: 100%; margin-left: auto; margin-right: auto; position: relative;">
						<span class="small text-muted d-block mb-2">Advertisement</span>
						<iframe title="Advertisement" data-aa="2462874" loading="lazy"
							src="https://acceptable.a-ads.com/2462874/?size=Adaptive"
							style="border: 0; padding: 0; width: 70%; height: auto; overflow: hidden; display: block; margin: auto"></iframe>
					</div>
					<p id="gameClaimError" class="text-danger" role="alert"></p>
				</div>
				<div class="modal-footer justify-content-center">
					<button type="button" class="btn btn-primary" id="gameClaimButton">
						Claim 50 coins
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

	<script type="text/javascript" th:src="@{/js/sb-admin-2.min.js}"></script>

	<!-- Page level plugins -->
	<script th:src="@{vendor/chart.js/Chart.min.js}"></script>

	<!-- Page level custom scripts -->
	<script>
		let gameClaimSecondsRemaining = null;
		let gameClaimTimer = null;
		let gameClaimModalShown = false;

		function updateGameClaimCountdown() {
			const countdown = document.getElementById('gameClaimCountdown');
			const claimButton = document.getElementById('gameClaimButton');
			if (gameClaimSecondsRemaining > 0) {
				const hours = Math.floor(gameClaimSecondsRemaining / 3600);
				const minutes = Math.floor((gameClaimSecondsRemaining % 3600) / 60);
				const seconds = gameClaimSecondsRemaining % 60;
				countdown.textContent = `Next 50-coin claim in ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
				claimButton.disabled = true;
				return;
			}

			countdown.textContent = 'Your 50-coin game claim is ready.';
			claimButton.disabled = false;
			if (!gameClaimModalShown) {
				gameClaimModalShown = true;
				$('#gameClaimModal').modal({ backdrop: false, keyboard: true });
			}
		}

		function startGameClaimCountdown(secondsRemaining) {
			if (gameClaimTimer) {
				clearInterval(gameClaimTimer);
			}
			gameClaimSecondsRemaining = secondsRemaining;
			updateGameClaimCountdown();
			if (gameClaimSecondsRemaining > 0) {
				gameClaimTimer = setInterval(() => {
					gameClaimSecondsRemaining = Math.max(0, gameClaimSecondsRemaining - 1);
					updateGameClaimCountdown();
					if (gameClaimSecondsRemaining === 0) {
						clearInterval(gameClaimTimer);
						gameClaimTimer = null;
					}
				}, 1000);
			}
		}

		async function syncGameClaimCountdown() {
			try {
				const response = await fetch('/claims/game/status');
				if (!response.ok) {
					throw new Error(`Could not load game claim status: ${response.status}`);
				}
				const secondsRemaining = Number(await response.json());
				if (!Number.isInteger(secondsRemaining) || secondsRemaining < 0) {
					throw new Error('The server returned an invalid game claim cooldown.');
				}
				startGameClaimCountdown(secondsRemaining);
			} catch (error) {
				console.error('Error loading game claim status:', error);
				document.getElementById('gameClaimCountdown').textContent =
						'Could not load the game claim timer. Retrying shortly...';
				setTimeout(syncGameClaimCountdown, 5000);
			}
		}

		document.addEventListener('DOMContentLoaded', () => {
			const claimButton = document.getElementById('gameClaimButton');
			const claimError = document.getElementById('gameClaimError');

			claimButton.addEventListener('click', async () => {
				claimButton.disabled = true;
				claimError.textContent = '';
				try {
					const response = await fetch('/claims/game', {
						method: 'POST',
						headers: {
							[document.querySelector('meta[name="_csrf_header"]').content]:
								document.querySelector('meta[name="_csrf"]').content
						}
					});
					if (!response.ok) {
						const message = await response.text();
						throw new Error(message || `Claim failed: ${response.status}`);
					}

					const stats = await response.json();
					document.getElementById('monthlyPoints').textContent = String(stats.monthlyPoints);
					document.getElementById('annualPoints').textContent = String(stats.annualPoints);
					document.getElementById('numberOfClaims').textContent = String(stats.numberOfClaims);
					$('#gameClaimModal').modal('hide');
					gameClaimModalShown = false;
					await syncGameClaimCountdown();
				} catch (error) {
					console.error('Error claiming game coins:', error);
					claimError.textContent = 'Could not claim the coins. Please try again.';
					await syncGameClaimCountdown();
				}
			});

			syncGameClaimCountdown();
		});

		function toggleFullscreen(icon) {
    const card = icon.closest('.card');
    const isFullscreen = card.classList.contains('fullscreen-card');

    if (isFullscreen) {
        card.classList.remove('fullscreen-card');
        icon.classList.remove('fa-compress');
        icon.classList.add('fa-expand');
        icon.setAttribute('title', 'Espandi');
    } else {
        card.classList.add('fullscreen-card');
        icon.classList.remove('fa-expand');
        icon.classList.add('fa-compress');
        icon.setAttribute('title', 'Riduci');
    }
}
	</script>
</body>

</html>
