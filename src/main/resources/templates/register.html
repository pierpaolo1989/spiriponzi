<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Spiriponzi - Registration</title>
<link rel="icon" type="image/svg" href="img/favicon.ico">
<link th:href="@{vendor/fontawesome-free/css/all.min.css}"
	rel="stylesheet" type="text/css">
<link
	href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet" />
	<style>
		.container {
    display: flex;
    align-items: center;
    justify-content: center; /* Opzionale per centrare anche orizzontalmente */
    min-height: 100vh;
}

        .row.justify-content-center {
            flex: 1;
        }
	</style>
</head>
<body class="bg-gradient-primary">
	
	<div class="container">
		<div class="row justify-content-center">

			<div class="col-xl-10 col-lg-12 col-md-9">

				<div class="card o-hidden border-0 shadow-lg my-5">
					<div class="card-body p-0">
						<div class="row">
							<div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
							<div class="col-lg-6">
								<div class="p-5">
									<div th:if="${param.success}">
										<div class="alert alert-info">You've successfully
											registered to our app!</div>
									</div>
									<div class="text-center">
										<h1 class="h4 text-gray-900 mb-4">Registration</h1>
									</div>
									<form method="post" role="form" th:action="@{/register/save}"
										th:object="${user}">
										<div class="form-group mb-3">
											<label class="form-label">Email *</label> <input
												class="form-control" id="email" name="email"
												placeholder="Enter email address" th:field="*{email}"
												type="email" />
											<p th:errors="*{email}" class="text-danger"
												th:if="${#fields.hasErrors('email')}"></p>
										</div>
										<div class="form-group mb-3">
											<label class="form-label">Password *</label> <input
												class="form-control" id="password" name="password"
												placeholder="Enter password" th:field="*{password}"
												type="password" />
											<p th:errors="*{password}" class="text-danger"
												th:if="${#fields.hasErrors('password')}"></p>
										</div>

										<div class="form-group mb-3">
											<label class="form-label">Confirm password *</label> <input
												class="form-control" id="password" name="password"
												placeholder="Confirm password" th:field="*{confirmPassword}"
												type="password" />
											<p th:errors="*{password}" class="text-danger"
												th:if="${#fields.hasErrors('password')}"></p>
										</div>

										<div class="form-group mb-3">
											<input id="terms" type="checkbox" th:field="*{terms}" /> <label
												class="control-label small" for="terms"> I agree
												with the <a href="#">terms and conditions</a> for
												Registration.
											</label>
											<p class="error-message"
												th:each="error : ${#fields.errors('terms')}"
												th:text="${error}">Validation error</p>
										</div>

										<div class="mb-3">
											<button class="btn btn-primary" type="submit">Register</button>
										</div>
									</form>
									<hr>
									<div class="text-center">
										<span class="small">Already registered? <a href="/"
												th:href="@{/login}">Login here</a></span>
									</div>
									<div class="text-center">
										<a class="small" th:href="@{/recover-password}">Forgot
											Password?</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>

		</div>
	</div>
	<!-- Bootstrap core JavaScript-->
	<script th:src="@{vendor/jquery/jquery.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

	<!-- Custom scripts for all pages-->
	<script th:src="@{js/sb-admin-2.min.js}"></script>
</body>
</html>
