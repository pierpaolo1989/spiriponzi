<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Choose a new password for your Spiriponzi account.">
	<meta name="robots" content="noindex, nofollow">
	<title>Spiriponzi - Choose a new password</title>
	<link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">
	<link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800" rel="stylesheet">
	<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet">
	<link th:href="@{/css/public-pages.css}" rel="stylesheet">
	<script defer th:src="@{/js/public-navbar.js}"></script>
</head>
<body class="bg-gradient-primary">
	<nav class="public-navbar" aria-label="Main navigation">
		<div class="public-navbar-content">
			<a class="public-brand" th:href="@{/index}" aria-label="Spiriponzi home">
				<img th:src="@{/img/spiriponzi-mark.svg}" alt="" aria-hidden="true">
				<span class="public-brand-copy">
					<span class="public-brand-name">Spiriponzi</span>
					<span class="public-brand-tagline">Sicilian slang for money</span>
				</span>
			</a>
			<button class="public-nav-toggle" type="button" aria-label="Open navigation menu"
				aria-expanded="false" aria-controls="publicNavLinks">
				<i class="fas fa-bars" aria-hidden="true"></i>
			</button>
			<div class="public-nav-links" id="publicNavLinks">
				<a th:href="@{/faq}">How it works</a>
				<a th:href="@{/terms}">Terms</a>
				<a th:href="@{/login}" aria-current="page">Login</a>
				<a th:href="@{/register}">Join us</a>
			</div>
		</div>
	</nav>

	<main class="public-page recover-password-page">
		<div class="row justify-content-center">
			<div class="col-xl-10 col-lg-12 col-md-9">
				<div class="card o-hidden border-0 shadow-lg">
					<div class="card-body p-0">
						<div class="row">
							<div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
							<div class="col-lg-6">
								<div class="p-5">
									<h1 class="h4 text-gray-900 font-weight-bold mb-4 text-center">Choose a new password</h1>
									<div th:if="${validToken}">
										<form method="post" th:action="@{/reset-password/save}" th:object="${password}">
											<input type="hidden" th:field="*{token}">
											<div class="mb-3">
												<label for="password" class="control-label">New password *</label>
												<input type="password" id="password" th:field="*{password}" class="form-control" autocomplete="new-password" required>
												<p class="text-danger small" th:errors="*{password}"></p>
											</div>
											<div class="mb-3">
												<label for="confirmPassword" class="control-label">Confirm new password *</label>
												<input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" required>
												<p class="text-danger small" th:errors="*{confirmPassword}"></p>
											</div>
											<p class="text-danger small" th:errors="*{token}"></p>
											<button type="submit" class="btn btn-primary btn-block">Save new password</button>
										</form>
									</div>
									<div th:unless="${validToken}" class="text-center">
										<p class="text-gray-700">This password reset link is invalid or has expired.</p>
										<a class="btn btn-primary" th:href="@{/recover-password}">Request a new link</a>
									</div>
									<hr>
									<div class="text-center">
										<a class="small" th:href="@{/login}">Return to login</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
<th:block th:replace="~{fragments/cloudflare-analytics}"></th:block>
</body>
</html>
