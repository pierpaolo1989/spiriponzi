<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="SOA Information technology">

<title>Spiriponzi - Recover password</title>

<link rel="icon" type="image/svg" href="img/favicon.ico">

<!-- Custom fonts for this template-->
<link th:href="@{vendor/fontawesome-free/css/all.min.css}"
	rel="stylesheet" type="text/css">
<link
	href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet" />
	<style>
		.container {
    display: flex;
    align-items: center;
    justify-content: center; /* Opzionale per centrare anche orizzontalmente */
    min-height: 100vh;
}

		 .row.justify-content-center {
            flex: 1;
        }
	</style>

</head>

<body class="bg-gradient-primary">

	<div class="container">

		<!-- Outer Row -->
		<div class="row justify-content-center">

			<div class="col-xl-10 col-lg-12 col-md-9">

				<div class="card o-hidden border-0 shadow-lg my-5">
					<div class="card-body p-0">
						<!-- Nested Row within Card Body -->
						<div class="row">
							<div class="col-lg-6 d-none d-lg-block bg-login-image"></div>
							<div class="col-lg-6">
								<div class="p-5">
									<div th:if="${param.success}">
										<div class="alert alert-info">Email has been sent to recover password</div>
									</div>
									<div class="text-center">
										<h1 class="h4 text-gray-900 mb-4">Recover password</h1>
									</div>
									<form method="post" th:action="@{/recover-password/save}"
										class="form-horizontal" role="form" th:object="${password}">
										<div class="mb-3">
											<label for="email" class="control-label">Email *</label> <input
												type="text" id="email" name="email"
												class="form-control" placeholder="Email" />
										</div>

										<div class="mb-3">
											<label for="confirmEmail" class="control-label">Confirm
												email* </label> <input type="text" id="confirmEmail" name="confirmEmail"
												class="form-control" placeholder="Confirm email" />
										</div>

										<div class="mb-3">
											<button type="submit" class="btn btn-primary">Recover</button>
										</div>
									</form>
									<hr>
									<div class="text-center">
										<span class="small">Already registered? <a href="/"
											th:href="@{/login}">Login here</a></span>
									</div>
									<div class="text-center">
										<a class="small" th:href="@{/register}">Create account</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>

		</div>

	</div>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{vendor/jquery/jquery.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

	<!-- Custom scripts for all pages-->
	<script th:src="@{js/sb-admin-2.min.js}"></script>

</body>

</html>
