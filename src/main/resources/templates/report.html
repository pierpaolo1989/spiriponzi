<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="">

<title>Spiriponzi - Report</title>

<link rel="icon" type="image/svg" href="img/favicon.ico">

<!-- Custom fonts for this template-->
<link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet"
	type="text/css">
<link
	href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link href="css/sb-admin-2.min.css" rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.datatables.net/1.10.12/css/jquery.dataTables.min.css">

</head>

<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- Sidebar -->
		<div th:replace="fragments/sidebar"></div>
		<!-- End of Sidebar -->

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- Topbar -->
				<div th:replace="fragments/navbar"></div>
				<!-- End of Topbar -->

				<!-- Begin Page Content -->
				<div class="container-fluid">

					<div th:replace="fragments/summary"></div>

					<div class="col-lg-10 mb-4 offset-lg-1 mt-5">

						<!-- Section 1: Last 10 Claims -->
						<div class="card shadow mb-4">
							<div class="card-header d-flex justify-content-between align-items-center">
								<h6 class="m-0 font-weight-bold text-primary">Last 10 Claims</h6>
								<button class="btn btn-sm btn-link toggle-btn" data-toggle="collapse" data-target="#collapseClaims1"
										aria-expanded="true" aria-controls="collapseClaims1">
									<i class="fas fa-chevron-up"></i>
								</button>
							</div>
							<div id="collapseClaims1" class="collapse show">
								<div class="card-body">
									<table id="table_claims" class="display table table-striped" style="min-height: 200px;">
										<thead>
										<tr>
											<th>Id</th>
											<th>Date</th>
											<th>Amount</th>
										</tr>
										</thead>
										<tbody></tbody>
									</table>
								</div>
							</div>
						</div>

						<!-- Section 2: Other Claims -->
						<div class="card shadow mb-4">
							<div class="card-header d-flex justify-content-between align-items-center">
								<h6 class="m-0 font-weight-bold text-primary">Last 10 ads surfed</h6>
								<button class="btn btn-sm btn-link toggle-btn" data-toggle="collapse" data-target="#collapseClaims2"
										aria-expanded="false" aria-controls="collapseClaims2">
									<i class="fas fa-chevron-down"></i>
								</button>
							</div>
							<div id="collapseClaims2" class="collapse">
								<div class="card-body">
									<table id="table_surfed_ads" class="display table table-striped" style="min-height: 200px;">
										<thead>
										<tr>
											<th>Title</th>
											<th>Completed at</th>
											<th>Reward</th>
										</tr>
										</thead>
										<tbody>
										</tbody>
									</table>
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
				<!-- /.container-fluid -->

				<!-- End of Main Content -->

				<!-- Footer -->
				<div th:replace="fragments/footer"></div>
				<!-- End of Footer -->

			</div>
			<!-- End of Content Wrapper -->

		</div>
		<!-- End of Page Wrapper -->

		<!-- Bootstrap core JavaScript-->
		<script src="vendor/jquery/jquery.min.js"></script>
		<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

		<!-- Core plugin JavaScript-->
		<script src="vendor/jquery-easing/jquery.easing.min.js"></script>

		<!-- Custom scripts for all pages-->
		<script src="js/sb-admin-2.min.js"></script>

		<script
			src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
		<script id="row_template" type="text/x-handlebars-template">
 			{{#each this}}
		 		 <tr>
		 			<td>{{id}}</td>
					<td>{{formatDate date}}</td>
					<td>{{amount}}</td>
				</tr>
		  {{/each}}
		</script>

	<script id="row_template_ads" type="text/x-handlebars-template">
		{{#each this}}
		<tr>
			<td>{{title}}</td>
			<td>{{formatDateOnly completedAt}}</td>
			<td>{{reward}}</td>
		</tr>
		{{/each}}
	</script>

		<script>
			$(document)
					.ready(
							function() {

							  function updateArrowIcon($collapse, isShown) {
            const $icon = $collapse.prev('.card-header').find('i');
            $icon.removeClass('fa-chevron-down fa-chevron-up');
            $icon.addClass(isShown ? 'fa-chevron-up' : 'fa-chevron-down');
        }

        // Inizializza correttamente le icone in base allo stato iniziale
        updateArrowIcon($('#collapseClaims1'), true);
        updateArrowIcon($('#collapseClaims2'), false);

        // Accordion behavior
        $('#collapseClaims1').on('show.bs.collapse', function () {
            $('#collapseClaims2').collapse('hide');
            updateArrowIcon($(this), true);
        });

        $('#collapseClaims1').on('hide.bs.collapse', function () {
            updateArrowIcon($(this), false);
        });

        $('#collapseClaims2').on('show.bs.collapse', function () {
            $('#collapseClaims1').collapse('hide');
            updateArrowIcon($(this), true);
        });

        $('#collapseClaims2').on('hide.bs.collapse', function () {
            updateArrowIcon($(this), false);
        });

							Handlebars.registerHelper("formatDate", function (dateString) {
            let date = new Date(dateString);
            return date.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        });

        Handlebars.registerHelper("formatDateOnly", function (dateString) {
    let date = new Date(dateString);
    return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
});
								var row_source = $("#row_template").html();
								var row_template = Handlebars
										.compile(row_source);
								$
										.ajax({
											url : "http://localhost:8080/claims",
											type : "GET",
											contentType : "application/json; charset=utf-8",
											dataType : "json",
											success : function(response) {
												if (response.length === 0) {
													$('#table_claims tbody')
															.append(
																	"<td colspan=6>No data available</td>");
												} else {
													$('#table_claims tbody')
															.append(
																	row_template(response));
												}

												var row_source_ads = $("#row_template_ads").html();
								var row_template_ads = Handlebars
										.compile(row_source_ads);

											$
										.ajax({
											url : "http://localhost:8080/get-ads",
											type : "GET",
											contentType : "application/json; charset=utf-8",
											dataType : "json",
											success : function(response) {
												if (response.length === 0) {
													$('#table_surfed_ads tbody')
															.append(
																	"<td colspan=6>No data available</td>");
												} else {
													$('#table_surfed_ads tbody')
															.append(
																	row_template_ads(response));
												}
												}

											})
											}
										})
							});
		</script>
</body>

</html>
