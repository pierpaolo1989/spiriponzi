<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="">

<title>Spiriponzi - Report</title>

<link rel="icon" type="image/x-icon" th:href="@{/img/favicon.ico}">

<!-- Custom fonts for this template-->
<link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet"
	type="text/css">
<link
	href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet">
<link th:href="@{/css/user-dark-mode.css}" rel="stylesheet">

<link rel="stylesheet"
	href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" th:href="@{/css/datatables-custom.css}">
<style>
	.report-ad-slot {
		display: inline-block;
		width: 100%;
		max-width: 320px;
		height: 100px;
	}

	@media (min-width: 500px) {
		.report-ad-slot {
			width: 468px;
			max-width: none;
			height: 60px;
		}
	}

	@media (min-width: 800px) {
		.report-ad-slot {
			width: 728px;
			height: 90px;
		}
	}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
	crossorigin="anonymous"></script>

</head>

<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<!-- Sidebar -->
		<div th:replace="~{fragments/sidebar}"></div>
		<!-- End of Sidebar -->

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<!-- Topbar -->
				<div th:replace="~{fragments/navbar}"></div>
				<!-- End of Topbar -->

				<!-- Begin Page Content -->
				<div class="container-fluid">
					<div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
						<iframe title="Advertisement" data-aa="2462874" loading="lazy"
							src="https://acceptable.a-ads.com/2462874/?size=Adaptive"
							style="border: 0; padding: 0; width: 70%; height: auto; overflow: hidden; display: block; margin: auto"></iframe>
					</div>

					<div class="d-sm-flex align-items-center justify-content-between mb-4">
						<h1 class="h3 mb-0 text-gray-800">Report</h1>
					</div>

					<div th:replace="~{fragments/summary}"></div>

					<div class="row mb-4" id="reportStatistics" th:if="${reportStats != null}"
						 th:attr="data-claims=${reportStats.numberOfClaims},data-withdrawals=${reportStats.withdrawals}">
						<div class="col-lg-7 mb-4 mb-lg-0">
							<div class="card shadow h-100">
								<div class="card-header py-3">
									<h6 class="m-0 font-weight-bold text-primary">Daily claim points — current month</h6>
								</div>
								<div class="card-body">
									<div style="height: 280px; position: relative;">
										<canvas id="pointsByPeriodChart" role="img"
											aria-label="Bar chart showing recorded claim points for each day of the current month"></canvas>
									</div>
									<p class="small text-muted mb-0 mt-2">
										Shows points recorded as claims; other reward sources may not appear here.
									</p>
									<p id="dailyPointsChartError" class="text-danger mb-0 mt-2" role="alert" style="display: none;">
										Daily points could not be loaded. Please refresh the page.
									</p>
								</div>
							</div>
						</div>
						<div class="col-lg-5">
							<div class="card shadow h-100">
								<div class="card-header py-3">
									<h6 class="m-0 font-weight-bold text-primary">Account activity</h6>
								</div>
								<div class="card-body">
									<div style="height: 280px; position: relative;">
										<canvas id="accountActivityChart" role="img"
											aria-label="Pie chart comparing claims and approved withdrawals"></canvas>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="row">
					<div class="col-lg-10 mb-4 offset-lg-1">

						<!-- Section 1: Last 10 Claims -->
						<div class="card shadow mb-4">
							<div class="card-header py-3 d-flex justify-content-between align-items-center">
								<h6 class="m-0 font-weight-bold text-primary">Last 10 Claims</h6>
								<button class="btn btn-sm btn-link toggle-btn" data-toggle="collapse" data-target="#collapseClaims1"
										aria-expanded="true" aria-controls="collapseClaims1" type="button" aria-label="Toggle claims">
									<i class="fas fa-chevron-up"></i>
								</button>
							</div>
							<div id="collapseClaims1" class="collapse show">
								<div class="card-body">
									<div class="table-responsive">
									<table id="table_claims" class="display table table-striped styled-datatable">
										<thead>
										<tr>
											<th>Id</th>
											<th>Date</th>
											<th>Amount</th>
										</tr>
										</thead>
										<tbody></tbody>
									</table>
									</div>
								</div>
							</div>
						</div>

						<!-- Section 2: Other Claims -->
						<div class="card shadow mb-4">
							<div class="card-header py-3 d-flex justify-content-between align-items-center">
								<h6 class="m-0 font-weight-bold text-primary">Last 10 ads surfed</h6>
								<button class="btn btn-sm btn-link toggle-btn" data-toggle="collapse" data-target="#collapseClaims2"
										aria-expanded="false" aria-controls="collapseClaims2" type="button" aria-label="Toggle ads surfed">
									<i class="fas fa-chevron-down"></i>
								</button>
							</div>
							<div id="collapseClaims2" class="collapse">
								<div class="card-body">
									<div class="table-responsive">
									<table id="table_surfed_ads" class="display table table-striped styled-datatable">
										<thead>
										<tr>
											<th>Title</th>
											<th>Completed at</th>
											<th>Reward</th>
										</tr>
										</thead>
										<tbody>
										</tbody>
									</table>
									</div>
								</div>
							</div>
						</div>

					</div>
					</div>
					<div class="row">
						<div class="col-12 mb-4 text-center">
							<ins class="adsbygoogle report-ad-slot"
								 data-ad-client="ca-pub-3177939731250769"
								 data-ad-slot="6698101758"></ins>
							<script>
								(adsbygoogle = window.adsbygoogle || []).push({});
							</script>
						</div>
					</div>
				</div>
			</div>
				<!-- /.container-fluid -->

				<!-- End of Main Content -->

				<!-- Footer -->
				<div th:replace="~{fragments/footer}"></div>
				<!-- End of Footer -->

			</div>
			<!-- End of Content Wrapper -->

		</div>
		<!-- End of Page Wrapper -->

		<!-- Bootstrap core JavaScript-->
		<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
		<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

		<!-- Core plugin JavaScript-->
		<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

		<!-- Custom scripts for all pages-->
		<script th:src="@{/js/sb-admin-2.min.js}"></script>

		<script th:src="@{/vendor/chart.js/Chart.min.js}"></script>
		<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
		<script>
			$(function () {
				const reportStatistics = document.getElementById('reportStatistics');
				if (reportStatistics) {
					const claims = Number(reportStatistics.dataset.claims);
					const withdrawals = Number(reportStatistics.dataset.withdrawals);
					const chartTextColor = document.documentElement.dataset.theme === 'dark'
						? '#f8f9fc' : '#858796';

					$.getJSON('/claims/monthly-points')
						.done(function (dailyPoints) {
							new Chart(document.getElementById('pointsByPeriodChart'), {
								type: 'bar',
								data: {
									labels: dailyPoints.map(function (entry) { return String(entry.day); }),
									datasets: [{
										label: 'Points',
										data: dailyPoints.map(function (entry) { return Number(entry.points); }),
										backgroundColor: 'rgba(78, 115, 223, 0.75)',
										borderColor: '#4e73df',
										borderWidth: 1
									}]
								},
								options: {
									responsive: true,
									maintainAspectRatio: false,
									legend: { display: false },
									scales: {
										xAxes: [{ ticks: { fontColor: chartTextColor } }],
										yAxes: [{
											ticks: { beginAtZero: true, precision: 0, fontColor: chartTextColor }
										}]
									}
								}
							});
						})
						.fail(function (error) {
							console.error('Unable to load monthly claim points:', error);
							document.getElementById('dailyPointsChartError').style.display = 'block';
						});

					new Chart(document.getElementById('accountActivityChart'), {
						type: 'pie',
						data: {
							labels: ['Claims', 'Approved withdrawals'],
							datasets: [{
								data: [claims, withdrawals],
								backgroundColor: ['#4e73df', '#f6c23e'],
								borderColor: '#ffffff',
								borderWidth: 2
							}]
						},
						options: {
							responsive: true,
							maintainAspectRatio: false,
							legend: { position: 'bottom', labels: { fontColor: chartTextColor } }
						}
					});
				}

				function updateArrowIcon($collapse, isShown) {
					const $icon = $collapse.prev('.card-header').find('i');
					$icon.removeClass('fa-chevron-down fa-chevron-up');
					$icon.addClass(isShown ? 'fa-chevron-up' : 'fa-chevron-down');
				}

				function formatDate(data, includeTime, type) {
					if (!data) {
						return '';
					}
					const date = new Date(data);
					const timestamp = date.getTime();
					if (!Number.isFinite(timestamp)) {
						return data;
					}
					if (type === 'sort' || type === 'type') {
						return timestamp;
					}
					return date.toLocaleDateString('en-GB', includeTime
						? { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }
						: { day: '2-digit', month: '2-digit', year: 'numeric' });
				}

				const claimsTable = $('#table_claims').DataTable({
					ajax: { url: '/claims', dataSrc: '' },
					columns: [
						{ data: 'id', className: 'text-center align-middle' },
						{
							data: 'date',
							className: 'text-center align-middle',
							render: function (data, type) { return formatDate(data, true, type); }
						},
						{ data: 'amount', className: 'text-center align-middle' }
					],
					order: [],
					language: { emptyTable: 'No data available' }
				});
				let adsTable;

				$('#collapseClaims1').on('show.bs.collapse', function () {
					$('#collapseClaims2').collapse('hide');
					updateArrowIcon($(this), true);
				}).on('shown.bs.collapse', function () {
					claimsTable.columns.adjust();
				}).on('hide.bs.collapse', function () {
					updateArrowIcon($(this), false);
				});

				$('#collapseClaims2').on('show.bs.collapse', function () {
					$('#collapseClaims1').collapse('hide');
					updateArrowIcon($(this), true);
				}).on('shown.bs.collapse', function () {
					if (!adsTable) {
						adsTable = $('#table_surfed_ads').DataTable({
							ajax: { url: '/get-ads', dataSrc: '' },
							columns: [
								{ data: 'title', className: 'text-center align-middle' },
								{
									data: 'completedAt',
									className: 'text-center align-middle',
									render: function (data, type) { return formatDate(data, false, type); }
								},
								{ data: 'reward', className: 'text-center align-middle' }
							],
							order: [],
							language: { emptyTable: 'No data available' }
						});
					} else {
						adsTable.columns.adjust();
					}
				}).on('hide.bs.collapse', function () {
					updateArrowIcon($(this), false);
				});
			});
		</script>
</body>

</html>
