<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">

	<title>Spiriponzi - Withdrawals</title>

	<link rel="icon" type="image/svg" href="img/favicon.ico">

	<!-- Custom fonts for this template-->
	<link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
	<link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

	<!-- Custom styles for this template-->
	<link href="css/sb-admin-2.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.datatables.net/1.10.12/css/jquery.dataTables.min.css">

	<style>
		.modal-backdrop.show {
            opacity: 0.8 !important;
        }

        .modal-dialog {
            margin-top: 10vh;
        }

        .modal-content {
            border-radius: 1rem;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
    .status-dot {
        transition: transform 0.2s;
    }

    .status-dot:hover {
        transform: scale(1.2);
        cursor: pointer;
    }

    #table_menu_wrapper {
        color: #5a5c69;
        font-size: 0.9rem;
    }

    #table_menu {
        width: 100% !important;
        margin: 0 !important;
        border-collapse: separate;
        border-spacing: 0;
    }

    #table_menu thead th {
        background-color: #4e73df;
        color: #fff;
        border-bottom: 0;
        font-weight: 700;
        padding: 0.85rem 0.75rem;
        white-space: nowrap;
    }

    #table_menu tbody td {
        padding: 0.8rem 0.75rem;
        border-top: 1px solid #e3e6f0;
    }

    #table_menu tbody tr:hover {
        background-color: #f8f9fc;
    }

    #table_menu_wrapper .dataTables_length,
    #table_menu_wrapper .dataTables_filter,
    #table_menu_wrapper .dataTables_info {
        color: #858796;
        padding: 0.75rem 0;
    }

    #table_menu_wrapper .dataTables_filter input,
    #table_menu_wrapper .dataTables_length select {
        border: 1px solid #d1d3e2;
        border-radius: 0.35rem;
        color: #6e707e;
        padding: 0.35rem 0.6rem;
        margin-left: 0.4rem;
    }

    #table_menu_wrapper .dataTables_filter input:focus,
    #table_menu_wrapper .dataTables_length select:focus {
        border-color: #bac8f3;
        outline: 0;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.2);
    }

    #table_menu_wrapper .dataTables_paginate {
        padding-top: 0.75rem;
    }

    #table_menu_wrapper .dataTables_paginate .paginate_button {
        border: 1px solid transparent !important;
        border-radius: 0.35rem;
        color: #4e73df !important;
        margin: 0 0.1rem;
        padding: 0.35rem 0.65rem;
    }

    #table_menu_wrapper .dataTables_paginate .paginate_button:hover {
        background: #eaecf4 !important;
        border-color: #eaecf4 !important;
        color: #224abe !important;
    }

    #table_menu_wrapper .dataTables_paginate .paginate_button.current,
    #table_menu_wrapper .dataTables_paginate .paginate_button.current:hover {
        background: #4e73df !important;
        border-color: #4e73df !important;
        color: #fff !important;
    }

    #table_menu_wrapper .dataTables_paginate .paginate_button.disabled,
    #table_menu_wrapper .dataTables_paginate .paginate_button.disabled:hover {
        color: #b7b9cc !important;
        background: transparent !important;
        border-color: transparent !important;
    }

    @media (max-width: 767.98px) {
        #table_menu_wrapper .dataTables_length,
        #table_menu_wrapper .dataTables_filter {
            float: none;
            text-align: left;
        }

        #table_menu_wrapper .dataTables_filter input {
            max-width: 60%;
        }
    }
	</style>
</head>

<body id="page-top">
<div id="wrapper">
	<div th:replace="~{fragments/sidebar}"></div>

	<div id="content-wrapper" class="d-flex flex-column">
		<div id="content">
			<div th:replace="~{fragments/navbar}"></div>

			<div class="container-fluid">
				<div class="d-sm-flex align-items-center justify-content-between mb-4">
					<h1 class="h3 mb-0 text-gray-800">Withdraw Requests</h1>
				</div>

				<div th:replace="~{fragments/summary}"></div>

				<hr class="divider">

				<div class="alert alert-warning col-lg-6 offset-lg-3" role="alert">
					<ul>
						<li>You can submit a withdraw request when you reach <strong>3000</strong> points!</li>
						<li>The conversion rate depends on market condition</li>
						<li>It's possible to convert points in <strong>BTC</strong> or <strong>ETH</strong></li>
					</ul>
				</div>

				<div class="row" style="margin-top: 3%;">
					<div class="col-lg-10 offset-lg-1">
						<div class="card shadow mb-4">
							<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
								<h6 class="m-0 font-weight-bold text-primary">Withdrawal history</h6>
								<button class="btn btn-primary btn-sm" id="start_withdraw" data-toggle="modal" data-target="#withdrawalModal">START WITHDRAW</button>
							</div>
							<div class="card-body">
								<div class="table-responsive">
									<table id="table_menu" class="display table table-striped" style="min-height: 300px;">
										<thead>
										<tr>
											<th>Id</th>
											<th>Currency</th>
											<th>Amount</th>
											<th>Date</th>
											<th>Status</th>
											<th>Transaction ID</th>
										</tr>
										</thead>
										<tbody>
										</tbody>
									</table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div th:replace="~{fragments/footer}"></div>
		</div>
	</div>
</div>

<!-- Modal -->
<!-- Modal -->
<div class="modal fade" id="withdrawalModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="exampleModalLabel">Withdrawal</h5>
				<button class="close" type="button" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">×</span>
				</button>
			</div>
			<div class="modal-body">
				<form enctype="utf8" class="text-center">
					<div class="mb-3">
						<input type="number" id="username" name="username" class="form-control" placeholder="Amount *" />
					</div>
					<div class="mb-3">
						<select class="form-select form-control" aria-label="Default select example" id="wallet-destination">
							<option selected>Choose wallet destination</option>
							<option value="BTC">BTC</option>
							<option value="ETH">ETH</option>
						</select>
					</div>
					<div id="wallet-data"
						 th:data-btc="${user.btcWallet}"
						 th:data-eth="${user.ethWallet}"
						 style="display:none;"></div>
					<div class="mb-3" id="wallet-address-group" style="display: none;">
						<input type="text" id="wallet-address" name="wallet-address" class="form-control" placeholder="Wallet Address *" />
					</div>
					<div class="mb-3">
						<div style="text-align: center;">
							<div class="g-recaptcha"
								 style="margin-top: 3%;"
								 th:attr="data-sitekey=${@captchaSettings.getSite()}"
								 data-callback="recaptchaCallback"></div>
							<span id="captchaError" class="alert alert-danger col-sm-4"
								  style="display: none"></span>
						</div>
					</div>
				</form>
				<div id="withdraw-error" class="alert alert-danger text-center" style="display: none;"></div>
			</div>
			<div class="modal-footer">
				<button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
				<button class="btn btn-primary" id="proceed_withdraw" disabled>Proceed</button>
			</div>
		</div>
	</div>
</div>

<!-- Bootstrap core JavaScript-->
<script src="vendor/jquery/jquery.min.js"></script>
<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- Core plugin JavaScript-->
<script src="vendor/jquery-easing/jquery.easing.min.js"></script>

<!-- Custom scripts for all pages-->
<script src="js/sb-admin-2.min.js"></script>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script>
	const walletData = document.getElementById('wallet-data');
const userBTCWallet = walletData.dataset.btc || '';
const userETHWallet = walletData.dataset.eth || '';
let captchaCompleted = false;

function recaptchaCallback() {
    captchaCompleted = true;
    checkFields();
}

function onWalletChange() {
    const wallet = document.getElementById('wallet-destination').value;
    const walletAddressGroup = document.getElementById('wallet-address-group');
    const walletAddress = document.getElementById('wallet-address');

    if (wallet === "BTC" || wallet === "ETH") {
        walletAddressGroup.style.display = "block";

        // Setta subito il valore visibile nell'input
        walletAddress.value = (wallet === "BTC") ? userBTCWallet : userETHWallet;
    } else {
        walletAddressGroup.style.display = "none";
        walletAddress.value = "";
    }

    checkFields(); // Poi ricalcola se abilitare il bottone
}

function checkFields() {
    const amount = document.getElementById('username').value;
    const wallet = document.getElementById('wallet-destination').value;
    const walletAddress = document.getElementById('wallet-address');
    const proceedButton = document.getElementById('proceed_withdraw');

    if (amount && (wallet === "BTC" || wallet === "ETH") && walletAddress.value && captchaCompleted) {
        proceedButton.disabled = false;
    } else {
        proceedButton.disabled = true;
    }
}

document.getElementById('username').addEventListener('input', checkFields);
document.getElementById('wallet-destination').addEventListener('change', onWalletChange);
document.getElementById('wallet-address').addEventListener('input', checkFields);

$(document).ready(function () {
    $('#table_menu').DataTable({
        ajax: {
            url: '/withdraws',
            dataSrc: ''
        },
        columns: [
            { data: 'id',
              className: 'text-center align-middle',},
            { data: 'currency' ,
             className: 'text-center align-middle',},
            { data: 'amount',
              className: 'text-center align-middle',},
            {
                data: 'dateRequest',
                 className: 'text-center align-middle',
                render: function (data) {
                    const dateObj = new Date(data);
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const year = dateObj.getFullYear();
                    const hours = String(dateObj.getHours()).padStart(2, '0');
                    const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                    return `${day}/${month}/${year} ${hours}:${minutes}`;
                }
            },
          {
    data: 'status',
    className: 'text-center align-middle',
    render: function (data) {
        const color = data === 'PENDING' ? 'red' : 'green';
        const tooltip = data === 'PENDING' ? 'Pending' : 'Completed';
        return `
            <div class="d-flex justify-content-center align-items-center" data-toggle="tooltip" title="${tooltip}">
                <span class="status-dot" style="
                    display:inline-block;
                    width:14px;
                    height:14px;
                    border-radius:50%;
                    background-color:${color};
                "></span>
            </div>`;
    }
},
            {
                data: 'transactionId',
                 className: 'text-center align-middle',
                render: function (data) {
                    return data && data.trim() !== '' ? data : '-';
                }
            }
        ],
        language: {
            emptyTable: "No pending or completed requests"
        }
    });
});

$('#withdrawalModal').on('shown.bs.modal', function () {
    document.getElementById('withdraw-error').style.display = 'none';
    document.getElementById('proceed_withdraw').style.display = 'inline-block';
    checkFields(); // ripristina lo stato del bottone
});

	document.getElementById('proceed_withdraw').addEventListener('click', function () {
	const amount = parseFloat(document.getElementById('username').value);
	const currency = document.getElementById('wallet-destination').value;

	if (!amount || isNaN(amount)) {
		alert("Please enter a valid amount.");
		return;
	}

	if (currency !== "BTC" && currency !== "ETH") {
		alert("Please select a valid currency.");
		return;
	}

	const data = {
		amount: amount,
		currency: currency
	};

	// Esegui la chiamata POST AJAX
	$.ajax({
		type: "POST",
		url: "/withdraws",
		contentType: "application/json",
		data: JSON.stringify(data),
		success: function (response) {
			alert("Withdrawal request sent successfully!");
			$('#withdrawalModal').modal('hide');
			// Eventuale reset form
			document.getElementById('username').value = '';
			document.getElementById('wallet-destination').value = '';
			document.getElementById('wallet-address').value = '';
			document.getElementById('wallet-address-group').style.display = 'none';
			captchaCompleted = false;
			grecaptcha.reset(); // reset del captcha
			checkFields();
		},
		error: function (err) {
   const errorBox = document.getElementById('withdraw-error');
    const proceedButton = document.getElementById('proceed_withdraw');
    let errorMessage = "An error occurred during the withdrawal request";

    if (err.responseJSON && err.responseJSON.errorCode === 'INSUFFICIENT_POINTS') {
        errorMessage = "You don't have enough annual points for this withdrawal";
    } else if (err.responseJSON && err.responseJSON.errorCode === 'BELOW_MINIMUM') {
        errorMessage = "The withdrawal amount is below the minimum threshold";
    }

    errorBox.innerText = errorMessage;
    errorBox.style.display = 'block';
    proceedButton.style.display = 'none';
		}
	});
});
</script>
</body>

</html>
