<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>

	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">

	<title>Spiriponzi - Ads</title>

	<link rel="icon" type="image/svg" href="img/favicon.ico">

	<link th:href="@{vendor/fontawesome-free/css/all.min.css}"
		  rel="stylesheet" type="text/css">

	<!-- Custom fonts for this template-->
	<link
			href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
			rel="stylesheet">

	<!-- Custom styles for this template-->
	<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet" />

	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
			crossorigin="anonymous"></script>
	<style>
		.ad-container {
            display: grid;
            gap: 20px;
            padding: 20px;
        }
        .ad-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            position: relative;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .countdown {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .countdown i {
            margin-right: 5px;
        }
        .reward-info {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
            margin-top: 10px;
        }
        .reward-info i {
            margin-right: 5px;
        }
        .reward-button {
            margin-top: 10px;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .reward-button:disabled {
            background: gray;
            cursor: not-allowed;
        }
        .reward-button:hover:not(:disabled) {
            background: #218838;
        }
        @media (max-width: 1200px) {
            .ad-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 992px) {
            .ad-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .ad-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

		input:invalid {
    border-color: red;
}
.input-error {
    border: 2px solid red !important;
}

		.ad-header-bar {
    background-color: #007bff;
    font-size: 12px;
    padding: 4px 8px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    height: 20px;
    line-height: 12px;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1;
}

	</style>
</head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

	<!-- Sidebar -->
	<div th:replace="fragments/sidebar"></div>
	<!-- End of Sidebar -->

	<!-- Content Wrapper -->
	<div id="content-wrapper" class="d-flex flex-column">

		<!-- Main Content -->
		<div id="content">

			<!-- Topbar -->
			<div th:replace="fragments/navbar"></div>
			<!-- End of Topbar -->

			<!-- Begin Page Content -->
			<div class="container-fluid">

				<!-- Page Heading -->
				<div class="d-sm-flex align-items-center justify-content-between mb-4">
					<h1 class="h3 mb-0 text-gray-800">Create ads</h1>
					<i class="fas fa-money fa-sm text-white-50"></i>
				</div>

				<!-- Content Row -->
				<div th:replace="fragments/summary"></div>

				<!-- Content Row -->

				<div class="row">

					<!-- Area Chart -->
					<div class="col-lg-12 mb-4">
						<div class="card shadow mb-4">
							<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
								<h6 class="m-0 font-weight-bold text-primary">Your ads</h6>
							</div>
							<!-- Card Body -->
							<div class="card-body ad-container" style="min-height: 600px;">

								<div th:if="${ads == null or ads.isEmpty()}">
									<p class="text-center text-gray-500">There is no ads yet</p>
									<div class="text-center mt-3">
										<button class="btn btn-primary" onclick="toggleAdForm()">
											<i class="fas fa-plus"></i> CREATE AD
										</button>
									</div>
								</div>

								<div class="ad-card row align-items-center"
									 th:each="ad, iter : ${ads}"
									 th:data-url="${ad.url}"
									 th:data-timer="${ad.timer}"
									 th:data-id="${ad.id}"
									 th:data-reward="${ad.reward}"
									 th:classappend="${ad.completed} ? ' disabled' : ''"
									 onclick="openAd(this)"
									 style="max-height: 200px;">

									<div class="ad-header-bar text-white text-left px-2">
										CREATED AT: <span th:text="${ad.createdAt}">
									</div>

									<!-- Colonna principale: 10 colonne -->
									<div class="col-10">
										<p th:text="${ad.title}" class="font-weight-bold mb-1 text-left">Titolo Annuncio</p>

										<div class="reward-info justify-content-start mb-1">
											<i class="fas fa-coins text-warning"></i>
											<span th:text="${ad.reward} + ' coins'">10 coins</span>
										</div>

										<div class="countdown justify-content-start">
											<i class="fas fa-clock"></i>
											<span th:text="${ad.timer} + ' sec'">60 sec</span>
										</div>
									</div>

									<!-- Divider verticale -->
									<div class="col-1 d-flex justify-content-center">
										<div class="vr" style="height: 80%; width: 2px; background-color: #ccc;"></div>
									</div>

									<!-- Colonna azioni: 1 colonna -->
									<div class="col-1 d-flex flex-column align-items-center">
										<!-- Pulsante Pausa/Play -->
										<button class="btn btn-sm btn-outline-secondary mb-2" onclick="event.stopPropagation(); togglePause(this);">
											<i class="fas fa-play"></i>
										</button>

										<!-- Pulsante Budget -->
										<button class="btn btn-sm btn-outline-info" onclick="event.stopPropagation(); setBudget(this);">
											<i class="fas fa-coins"></i>
										</button>

										<!-- Pulsante Delete -->
										<button class="btn btn-sm btn-outline-danger mt-2" onclick="event.stopPropagation(); deleteAd(this);">
											<i class="fas fa-trash-alt"></i>
										</button>
									</div>

								</div>

								<!-- Form a comparsa per creare un nuovo annuncio -->
								<div id="adFormContainer" class="p-4" style="display:none; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); margin-top: 20px; background: #fff;">
									<h2>Create Ad</h2>
									<form id="adForm">
										<div class="form-group">
											<label for="title">Title</label>
											<input type="text" id="title" class="form-control" required maxlength="150">
										</div>
										<div class="form-group">
											<label for="url">URL</label>
											<input type="url" id="url" class="form-control" required>
										</div>
										<div class="form-group">
											<label for="duration">Minimum Visit Duration (seconds)</label>
											<input type="number" id="duration" class="form-control" required>
										</div>
										<div class="form-group">
											<label for="points">Points per View</label>
											<input type="number" id="points" class="form-control" required>
										</div>
										<button type="submit" class="btn btn-success">Submit</button>
										<button type="button" class="btn btn-secondary" onclick="toggleAdForm()">Cancel</button>
									</form>
								</div>

							</div>
						</div>
					</div>

				</div>

			</div>
			<!-- /.container-fluid -->

		</div>
		<!-- End of Main Content -->

		<!-- Footer -->
		<div th:replace="fragments/footer"></div>
		<!-- End of Footer -->

	</div>
	<!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

	<!-- Scroll to Top Button-->
	<a class="scroll-to-top rounded" href="#page-top"> <i
		class="fas fa-angle-up"></i>
	</a>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

	<script type="text/javascript" th:src="@{/js/sb-admin-2.min.js}"></script>

	<!-- Page level plugins -->
	<script th:src="@{vendor/chart.js/Chart.min.js}"></script>

	<!-- Page level custom scripts -->
	<script src='https://www.google.com/recaptcha/api.js'></script>
<!-- Script per mostrare/nascondere il form -->
<script>
	let adToDelete = null;

    function deleteAd(button) {
        const adCard = button.closest('.ad-card');
        adToDelete = adCard;
        $('#deleteAdModal').modal('show');
    }

    document.addEventListener('DOMContentLoaded', () => {
        const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

        confirmDeleteBtn.addEventListener("click", function () {
            if (!adToDelete) return;

            const adId = adToDelete.dataset.id;

            if (!adId) {
                alert("Invalid ad ID.");
                return;
            }

            fetch(`/user-ads/${adId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                  fetch('/fragment/user-ads')
    .then(response => response.text())
    .then(html => {
    debugger;
        const container = document.querySelector('.ad-container');
        container.innerHTML = html;
        $('#deleteAdModal').modal('hide');
    });
                } else {
                    alert("Failed to delete ad.");
                }
            })
            .catch(error => {
                console.error("Error deleting ad:", error);
                alert("Server error. Please try again later.");
            });
        });
    });

        function toggleAdForm() {
            let formContainer = document.getElementById("adFormContainer");
            formContainer.style.display = (formContainer.style.display === "none" || formContainer.style.display === "") ? "block" : "none";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById("adForm");

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                let isValid = true;
                const inputs = form.querySelectorAll("input");

                inputs.forEach(input => {
                    input.classList.remove("input-error");
                    if (!input.value.trim()) {
                        input.classList.add("input-error");
                        isValid = false;
                    }
                });

                 if (isValid) {
                    const data = {
                        title: title.value,
                        url: document.getElementById("url").value,
                        timer: document.getElementById("duration").value,
                        reward: document.getElementById("points").value
                    };

                    fetch('/user-ads', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    })
                    .then(response => {
                        if (response.ok) {
                            alert("Ad created successfully!");
                            form.reset();
                            toggleAdForm(); // Nascondi il form
                            // Qui potresti anche aggiornare la lista degli ad senza ricaricare la pagina
                        } else {
                            alert("Something went wrong while submitting the ad.");
                        }
                    })
                    .catch(error => {
                        console.error("Error:", error);
                        alert("Server error. Please try again later.");
                    });
                }
            });
        });
</script>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
			crossorigin="anonymous"></script>

<!-- Modale di conferma eliminazione -->
<div class="modal fade" id="deleteAdModal" tabindex="-1" role="dialog" aria-labelledby="deleteAdModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header bg-danger text-white">
				<h5 class="modal-title" id="deleteAdModalLabel">Delete Ad</h5>
				<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				Are you sure you want to delete this ad?
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
			</div>
		</div>
	</div>
</div>
</body>

</html>
