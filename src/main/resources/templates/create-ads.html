<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>

	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="">
	<meta name="author" content="">

	<title>Spiriponzi - Ads</title>

	<link rel="icon" type="image/svg" href="img/favicon.ico">

	<link th:href="@{vendor/fontawesome-free/css/all.min.css}"
		  rel="stylesheet" type="text/css">

	<!-- Custom fonts for this template-->
	<link
			href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
			rel="stylesheet">

	<!-- Custom styles for this template-->
	<link th:href="@{/css/sb-admin-2.css}" rel="stylesheet" />

	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
			crossorigin="anonymous"></script>
	<style>
		.ad-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }
        .ad-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            position: relative;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .ad-card:hover {
            transform: scale(1.05);
        }
        .countdown {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .countdown i {
            margin-right: 5px;
        }
        .reward-info {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
            margin-top: 10px;
        }
        .reward-info i {
            margin-right: 5px;
        }
        .reward-button {
            margin-top: 10px;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .reward-button:disabled {
            background: gray;
            cursor: not-allowed;
        }
        .reward-button:hover:not(:disabled) {
            background: #218838;
        }
        @media (max-width: 1200px) {
            .ad-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 992px) {
            .ad-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .ad-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

		input:invalid {
    border-color: red;
}
.input-error {
    border: 2px solid red !important;
}
	</style>
</head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

	<!-- Sidebar -->
	<div th:replace="fragments/sidebar"></div>
	<!-- End of Sidebar -->

	<!-- Content Wrapper -->
	<div id="content-wrapper" class="d-flex flex-column">

		<!-- Main Content -->
		<div id="content">

			<!-- Topbar -->
			<div th:replace="fragments/navbar"></div>
			<!-- End of Topbar -->

			<!-- Begin Page Content -->
			<div class="container-fluid">

				<!-- Page Heading -->
				<div class="d-sm-flex align-items-center justify-content-between mb-4">
					<h1 class="h3 mb-0 text-gray-800">Create ads</h1>
					<i class="fas fa-money fa-sm text-white-50"></i>
				</div>

				<!-- Content Row -->
				<div th:replace="fragments/summary"></div>

				<!-- Content Row -->

				<div class="row">

					<!-- Area Chart -->
					<div class="col-lg-12 mb-4">
						<div class="card shadow mb-4">
							<div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
								<h6 class="m-0 font-weight-bold text-primary">Your ads</h6>
							</div>
							<!-- Card Body -->
							<div class="card-body ad-container" style="min-height: 600px;">

								<div th:if="${ads == null or ads.isEmpty()}">
									<p class="text-center text-gray-500">There is no ads yet</p>
									<div class="text-center mt-3">
										<button class="btn btn-primary" onclick="toggleAdForm()">
											<i class="fas fa-plus"></i> CREATE AD
										</button>
									</div>
								</div>

								<!-- Form a comparsa per creare un nuovo annuncio -->
								<div id="adFormContainer" class="p-4" style="display:none; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); margin-top: 20px; background: #fff;">
									<h2>Create Ad</h2>
									<form id="adForm">
										<div class="form-group">
											<label for="title">Title</label>
											<input type="text" id="title" class="form-control" required maxlength="150">
										</div>
										<div class="form-group">
											<label for="url">URL</label>
											<input type="url" id="url" class="form-control" required>
										</div>
										<div class="form-group">
											<label for="duration">Minimum Visit Duration (seconds)</label>
											<input type="number" id="duration" class="form-control" required>
										</div>
										<div class="form-group">
											<label for="points">Points per View</label>
											<input type="number" id="points" class="form-control" required>
										</div>
										<button type="submit" class="btn btn-success">Submit</button>
										<button type="button" class="btn btn-secondary" onclick="toggleAdForm()">Cancel</button>
									</form>
								</div>

							</div>
						</div>
					</div>

				</div>

			</div>
			<!-- /.container-fluid -->

		</div>
		<!-- End of Main Content -->

		<!-- Footer -->
		<div th:replace="fragments/footer"></div>
		<!-- End of Footer -->

	</div>
	<!-- End of Content Wrapper -->

</div>
<!-- End of Page Wrapper -->

	<!-- Scroll to Top Button-->
	<a class="scroll-to-top rounded" href="#page-top"> <i
		class="fas fa-angle-up"></i>
	</a>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{vendor/jquery-easing/jquery.easing.min.js}"></script>

	<script type="text/javascript" th:src="@{/js/sb-admin-2.min.js}"></script>

	<!-- Page level plugins -->
	<script th:src="@{vendor/chart.js/Chart.min.js}"></script>

	<!-- Page level custom scripts -->
	<script src='https://www.google.com/recaptcha/api.js'></script>
<!-- Script per mostrare/nascondere il form -->
<script>
    function toggleAdForm() {
        let formContainer = document.getElementById("adFormContainer");
        formContainer.style.display = (formContainer.style.display === "none" || formContainer.style.display === "") ? "block" : "none";
    }

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById("adForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            let isValid = true;
            const inputs = form.querySelectorAll("input");

            inputs.forEach(input => {
                input.classList.remove("input-error");
                if (!input.value.trim()) {
                    input.classList.add("input-error");
                    isValid = false;
                }
            });

             if (isValid) {
                const data = {
                    title: title.value,
                    url: document.getElementById("url").value,
                    timer: document.getElementById("duration").value,
                    reward: document.getElementById("points").value
                };

                fetch('/user-ads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })
                .then(response => {
                    if (response.ok) {
                        alert("Ad created successfully!");
                        form.reset();
                        toggleAdForm(); // Nascondi il form
                        // Qui potresti anche aggiornare la lista degli ad senza ricaricare la pagina
                    } else {
                        alert("Something went wrong while submitting the ad.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Server error. Please try again later.");
                });
            }
        });
    });
</script>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
			crossorigin="anonymous"></script>
</body>

</html>
