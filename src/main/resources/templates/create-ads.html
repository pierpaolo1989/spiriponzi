	<style>
		.ad-container {
            display: grid;
		    gap: 12px;
            padding: 20px;
        }
        .ad-card {
            border: 1px solid #ddd;
            padding: 15px;
            text-align: center;
            position: relative;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        #adList {
            display: contents;
        }
        .ad-card {
            padding-top: 36px;
        }
        .ad-empty-state {
            grid-column: 1 / -1;
        }
        .countdown {
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .countdown i {
            margin-right: 5px;
        }
        .reward-info {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffa500;
            margin-top: 10px;
        }
        .reward-info i {
            margin-right: 5px;
        }
        .reward-button {
            margin-top: 10px;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            display: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .reward-button:disabled {
            background: gray;
            cursor: not-allowed;
        }
        .reward-button:hover:not(:disabled) {
            background: #218838;
        }
        @media (max-width: 1200px) {
            .ad-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 992px) {
            .ad-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .ad-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }

		input:invalid {
    border-color: red;
}
.input-error {
    border: 2px solid red !important;
}

		.ad-header-bar {
    background-color: #007bff;
    font-size: 12px;
    padding: 4px 8px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    height: 20px;
    line-height: 12px;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1;
}

				<div th:replace="fragments/summary"></div>

								<div th:replace="fragments/ads :: adList"></div>

<!-- Script per mostrare/nascondere il form -->
<script>
	let adToDelete = null;
	let adToBudget = null;

    async function setBudget(button) {
        const selectedAd = button.closest('.ad-card');
        adToBudget = selectedAd;
        const reward = Number(selectedAd.dataset.reward);
        const input = document.getElementById('adBudgetInput');
        const saveButton = document.getElementById('saveAdBudgetBtn');
        const error = document.getElementById('adBudgetError');

        saveButton.disabled = true;
        error.textContent = '';
        if (!Number.isFinite(reward) || reward <= 0) {
            error.textContent = "This ad has an invalid reward, so its budget cannot be set.";
            document.getElementById('adBudgetLimits').textContent = '';
            $('#adBudgetModal').modal('show');
            return;
        }
        document.getElementById('adBudgetLimits').textContent = 'Loading your available coins...';
        $('#adBudgetModal').modal('show');

        try {
            const response = await fetch('/user-ads/balance');
            if (!response.ok) {
                throw new Error(`Could not load available coins: ${response.status}`);
            }

            const balance = Number(await response.json());
            if (!Number.isFinite(balance) || balance < 0) {
                throw new Error('The server returned an invalid coin balance.');
            }
            if (adToBudget !== selectedAd) return;

            const currentBudget = Number(selectedAd.dataset.budget) || 0;
            const maxBudget = Math.floor((balance + currentBudget) / reward) * reward;
            input.min = reward;
            input.max = maxBudget;
            input.step = reward;
            const initialBudget = currentBudget >= reward ? currentBudget : reward;
            input.value = Math.min(Math.ceil(initialBudget / reward) * reward, maxBudget);
            document.getElementById('adBudgetLimits').textContent =
                `Minimum: ${reward} coins (reward per view). Maximum valid budget: ${maxBudget} coins (available: ${balance} coins).`;
            error.textContent = balance < reward
                ? "Your available balance is lower than this ad's minimum budget."
                : "";
            saveButton.disabled = balance < reward;
        } catch (loadError) {
            console.error("Error loading available coins:", loadError);
            if (adToBudget === selectedAd) {
                error.textContent = "Could not load your current coins. Please try again.";
            }
        }
    }

    function deleteAd(button) {
        const adCard = button.closest('.ad-card');
        adToDelete = adCard;
        $('#deleteAdModal').modal('show');
    }

    async function togglePause(button) {
        const adCard = button.closest('.ad-card');
        const icon = button.querySelector('i');
        if (!adCard || !icon) return;

        button.disabled = true;
        try {
            const response = await fetch(`/user-ads/${adCard.dataset.id}/toggle-active`, {
                method: 'PUT'
            });
            if (!response.ok) {
                throw new Error(`Could not update ad status: ${response.status}`);
            }

            const active = await response.json();
            adCard.dataset.active = String(active);
            icon.classList.toggle('fa-play', !active);
            icon.classList.toggle('fa-pause', active);
            button.setAttribute('aria-label', active ? 'Pause ad' : 'Publish ad');
        } catch (error) {
            console.error("Error updating ad status:", error);
            alert("Could not update the ad status. Please try again.");
        } finally {
            button.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");

        confirmDeleteBtn.addEventListener("click", function () {
            if (!adToDelete) return;

            const adId = adToDelete.dataset.id;

            if (!adId) {
                alert("Invalid ad ID.");
                return;
            }

            fetch(`/user-ads/${adId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    return reloadAds().then(() => {
                        $('#deleteAdModal').modal('hide');
                        adToDelete = null;
                    });
                } else {
                    alert("Failed to delete ad.");
                }
            })
            .catch(error => {
                console.error("Error deleting ad:", error);
                alert("Server error. Please try again later.");
            });
        });
    });

    async function reloadAds() {
        const response = await fetch('/fragment/user-ads');
        if (!response.ok) {
            throw new Error(`Failed to refresh ads: ${response.status}`);
        }

        const html = await response.text();
        const adList = document.getElementById('adList');
        if (!adList) {
            throw new Error("Ad list container was not found.");
        }
        adList.outerHTML = html;
    }

        function toggleAdForm() {
            let formContainer = document.getElementById("adFormContainer");
            formContainer.style.display = (formContainer.style.display === "none" || formContainer.style.display === "") ? "block" : "none";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById("adForm");

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                let isValid = true;
                const inputs = form.querySelectorAll("input");

                inputs.forEach(input => {
                    input.classList.remove("input-error");
                    if (!input.value.trim()) {
                        input.classList.add("input-error");
                        isValid = false;
                    }
                });

                if (isValid) {
                    const data = {
                        title: document.getElementById("title").value,
                        url: document.getElementById("url").value,
                        timer: document.getElementById("duration").value,
                        reward: document.getElementById("points").value
                    };

                    try {
                        const response = await fetch('/user-ads', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });
                        if (!response.ok) {
                            alert("Something went wrong while submitting the ad.");
                            return;
                        }

                        form.reset();
                        toggleAdForm();

                        let message = "Ad created successfully!";
                        try {
                            await reloadAds();
                        } catch (error) {
                            console.error("Ad created, but the list could not be refreshed:", error);
                            message = "Ad created successfully, but the list could not be refreshed. Reload the page to see it.";
                        }

                        document.getElementById("createdAdMessage").textContent = message;
                        $('#createdAdModal').modal('show');
                    } catch (error) {
                        console.error("Error creating ad:", error);
                        alert("Server error. Please try again later.");
                    }
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const budgetInput = document.getElementById('adBudgetInput');
            const saveBudgetButton = document.getElementById('saveAdBudgetBtn');
            const budgetError = document.getElementById('adBudgetError');

            saveBudgetButton.addEventListener('click', async () => {
                if (!adToBudget) return;

                const budget = Number(budgetInput.value);
                const minimum = Number(budgetInput.min);
                const maximum = Number(budgetInput.max);
                if (!Number.isFinite(budget) || budget < minimum || budget > maximum) {
                    budgetError.textContent = `Enter an amount between ${minimum} and ${maximum} coins.`;
                    return;
                }
                if (budgetInput.validity.stepMismatch) {
                    budgetError.textContent = `Enter a multiple of ${minimum} coins.`;
                    return;
                }

                saveBudgetButton.disabled = true;
                budgetError.textContent = '';
                try {
                    const response = await fetch(`/user-ads/${adToBudget.dataset.id}/budget`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ budget })
                    });
                    if (!response.ok) {
                        const responseMessage = await response.text();
                        throw new Error(responseMessage || `Request failed: ${response.status}`);
                    }

                    const availableCoins = Number(await response.json());
                    if (!Number.isFinite(availableCoins) || availableCoins < 0) {
                        throw new Error('The server returned an invalid coin balance.');
                    }
                    adToBudget.dataset.budget = String(budget);
                    adToBudget.querySelector('.ad-budget-value').textContent = `${budget} coins`;
                    document.getElementById('annualPoints').textContent = String(availableCoins);
                    $('#adBudgetModal').modal('hide');
                    adToBudget = null;
                } catch (error) {
                    console.error("Error updating ad budget:", error);
                    budgetError.textContent = "Could not save the budget. Please try again.";
                } finally {
                    saveBudgetButton.disabled = false;
                }
            });

            budgetInput.addEventListener('input', () => {
                budgetError.textContent = '';
            });
        });
</script>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3177939731250769"
			crossorigin="anonymous"></script>

<!-- Modale di conferma eliminazione -->
<div class="modal fade" id="deleteAdModal" tabindex="-1" role="dialog" aria-labelledby="deleteAdModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header bg-danger text-white">
				<h5 class="modal-title" id="deleteAdModalLabel">Delete Ad</h5>
				<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				Are you sure you want to delete this ad?
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="createdAdModal" tabindex="-1" role="dialog" aria-labelledby="createdAdModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header bg-primary text-white">
				<h5 class="modal-title" id="createdAdModalLabel">Ad created</h5>
				<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body" id="createdAdMessage">
				Ad created successfully!
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="adBudgetModal" tabindex="-1" role="dialog" aria-labelledby="adBudgetModalLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header bg-primary text-white">
				<h5 class="modal-title" id="adBudgetModalLabel">Ad coins budget</h5>
				<button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<p id="adBudgetLimits" class="mb-3"></p>
				<div class="form-group mb-0">
					<label for="adBudgetInput">Coins to allocate</label>
					<input type="number" class="form-control" id="adBudgetInput" min="0" step="any" required>
					<small id="adBudgetError" class="form-text text-danger"></small>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" id="saveAdBudgetBtn">Save budget</button>
			</div>
		</div>
	</div>
</div>
</body>
