	<script>
	var count_antipasti = 1;
	var count = 1;
	var count_secondi = 1;
	var count_dolci = 1;
	$(document).ready(function() {
		 $('#addBtnAntipasto').click(function () {
	            let dynamicRowHTML = `
	            <tr class="rowClass""> 
	                <td class="row-index text-center"> 
	                <input type="text" class="form-control"
						placeholder="Nome piatto" id="antipasto_nome_${count_antipasti}">
	                </td> 
	                <td>
	                <input type="number" class="form-control"
						placeholder="Prezzo" id="antipasto_prezzo_${count_antipasti}">
	                </td>
	                <td class="text-center"> 
	                    <button class="btn btn-danger remove"
	                        type="button"><i class="fas fa-fw fa-trash"></i>
	                    </button> 
	                </td> 
	            </tr>`;
	            $('#tbody_antipasti').append(dynamicRowHTML);
	            count_antipasti++;
	        });
	     $('#addBtnPrimo').click(function () {
	            let dynamicRowHTML = `
	            <tr class="rowClass""> 
	                <td class="row-index text-center"> 
	                <input type="text" class="form-control"
						placeholder="Nome piatto" id="primo_nome_${count}">
	                </td> 
	                <td>
	                <input type="number" class="form-control"
						placeholder="Prezzo" id="primo_prezzo_${count}">
	                </td>
	                <td class="text-center"> 
	                    <button class="btn btn-danger remove"
	                        type="button"><i class="fas fa-fw fa-trash"></i>
	                    </button> 
	                </td> 
	            </tr>`;
	            $('#tbody').append(dynamicRowHTML);
	            count++;
	        });
	    $('#addBtnSecondo').click(function () {
	            let dynamicRowHTML = `
	            <tr class="rowClass""> 
	                <td class="row-index text-center"> 
	                <input type="text" class="form-control"
						placeholder="Nome piatto" id="secondo_nome_${count_secondi}">
	                </td> 
	                <td>
	                <input type="number" class="form-control"
						placeholder="Prezzo" id="secondo_prezzo_${count_secondi}">
	                </td>
	                <td class="text-center"> 
	                    <button class="btn btn-danger remove"
	                        type="button"><i class="fas fa-fw fa-trash"></i>
	                    </button> 
	                </td> 
	            </tr>`;
	            $('#tbody_secondi').append(dynamicRowHTML);
	            count_secondi++;
	        });
	 
	     $('#addBtnDolce').click(function () {
	            let dynamicRowHTML = `
	            <tr class="rowClass""> 
	                <td class="row-index text-center"> 
	                <input type="text" class="form-control"
						placeholder="Nome piatto" id="dolce_nome_${count_dolci}">
	                </td> 
	                <td>
	                <input type="number" class="form-control"
						placeholder="Prezzo" id="dolce_prezzo_${count_dolci}">
	                </td>
	                <td class="text-center"> 
	                    <button class="btn btn-danger remove"
	                        type="button"><i class="fas fa-fw fa-trash"></i>
	                    </button> 
	                </td> 
	            </tr>`;
	            $('#tbody_dolci').append(dynamicRowHTML);
	            count_dolci++;
	        });
	 
	     	//Remove rows on tables
	     	$('#tbody_antipasti').on('click', '.remove', function () {
	            $(this).parent('td.text-center').parent('tr.rowClass').remove(); 
	        });
	        $('#tbody').on('click', '.remove', function () {
	            $(this).parent('td.text-center').parent('tr.rowClass').remove(); 
	        });
	        $('#tbody_secondi').on('click', '.remove', function () {
	            $(this).parent('td.text-center').parent('tr.rowClass').remove(); 
	        });
	        $('#tbody_dolci').on('click', '.remove', function () {
	            $(this).parent('td.text-center').parent('tr.rowClass').remove(); 
	        });
	});
	
	$('#saveMenuToDb').click(function() {
		
		var url= "http://localhost:8080/menu";
		var products = [];
		
		for (let i = 1; i < count; i++) {
			var primo = {
					"name" : $('#primo_nome_' + i).val(),
					"price": $('#primo_prezzo_' + i).val(),
					"category": "PRIMI"
			}
			products.push(primo);
		}
		
		for (let i = 1; i < count_secondi; i++) {
			var secondo = {
					"name" : $('#secondo_nome_' + i).val(),
					"price": $('#secondo_prezzo_' + i).val(),
					"category": "SECONDI"
			}
			products.push(secondo);
		}
		
		for (let i = 1; i < count_dolci; i++) {
			var dolce = {
					"name" : $('#dolce_nome_' + i).val(),
					"price": $('#dolce_prezzo_' + i).val(),
					"category": "SECONDI"
			}
			products.push(secondo);
		}
		
		var menu = {};
		menu.name = "test";
		menu.products = products;
		
		$.ajax({
			  url:url,
			  type:"POST",
			  data: JSON.stringify(menu),
			  contentType:"application/json; charset=utf-8",
			  dataType:"json",
			  success: function(response){
				  console.log(response)
				  $('#itemPreview').attr('src', `data:image/png;base64,${response}`);
			  }
			})
		 
	})
	</script>
